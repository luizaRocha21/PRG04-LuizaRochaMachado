# =============================================================================
# Blueprint do Render: cria o serviço da API UniBus (backend Spring Boot em Docker).
# Documentação: https://render.com/docs/blueprint-spec
#
# Valores com "sync: false" NÃO ficam no repositório: o Render os pede no painel
# (Dashboard -> New -> Blueprint) e depois em Environment.
# =============================================================================
services:
  - type: web
    name: unibus-api
    runtime: docker
    plan: free
    # Caminhos relativos à raiz do repositório (o backend fica na subpasta backend/)
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # O Render considera o deploy saudável quando GET / responde 200
    healthCheckPath: /
    envVars:
      # Conexão JDBC com o Supabase (Session pooler). Veja backend/README.md
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Endereço do frontend publicado (ex.: https://seu-app.vercel.app)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
