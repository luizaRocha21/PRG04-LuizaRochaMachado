<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniBus — Login</title>

  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../assets/css/global.css" />
  <link rel="stylesheet" href="../assets/css/login.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="cabecalho">
    <div class="container">
      <a href="../index.html" class="marca">
        <img src="../favicon.svg" alt="Logo UniBus" />
        UniBus
      </a>

      <button
        id="botao-menu"
        class="botao-menu"
        type="button"
        aria-label="Abrir menu de navegação"
        aria-expanded="false"
        aria-controls="menu"
      >
        ☰
      </button>

      <nav id="menu" aria-label="Navegação principal">
        <ul class="menu">
          <li><a href="../index.html">Início</a></li>
          <li><a href="atividade-3.html">Como funciona</a></li>
          <li><a href="paleta-cores.html">Paleta de cores</a></li>
          <li><a href="sandbox.html">SandBox</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container secao">
    <div class="login-wrap">
      <h1>Acesse sua conta</h1>
      <p>Autenticação fictícia, apenas para fins didáticos.</p>

      <div class="cartao">
        <form id="form-login" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" placeholder="voce@exemplo.com" required />
            <div class="invalid-feedback">Informe um e-mail válido.</div>
          </div>

          <div class="mb-3">
            <label for="senha" class="form-label">Senha</label>
            <input type="password" class="form-control" id="senha" placeholder="••••••••" required />
            <div class="invalid-feedback">Informe sua senha.</div>
          </div>

          <button type="submit" class="btn btn-warning w-100 fw-bold">Entrar</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="rodape">
    <div class="container">
      <p>UniBus &copy; 2026 — Projeto acadêmico da disciplina PRG04 - PW.</p>
    </div>
  </footer>

  <script src="../assets/js/menu.js"></script>
  <script src="../assets/js/login.js"></script>
</body>
</html>
