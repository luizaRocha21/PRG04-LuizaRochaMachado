# =============================================================================
# Configuração comum a todos os ambientes
# As configurações específicas ficam em application-{perfil}.properties
# =============================================================================
spring.application.name=unibus-backend

# Perfil usado quando nenhum outro é informado: "local" (H2 em memória, sem configuração).
# Em produção (Render) o perfil "prod" é ativado pelo Dockerfile (SPRING_PROFILES_ACTIVE=prod).
spring.profiles.default=local

# O Render informa a porta pela variável PORT; localmente a API sobe na 8080.
server.port=${PORT:8080}

# O Render termina o HTTPS antes da aplicação: respeita X-Forwarded-* para montar URLs corretas
# (por exemplo, o cabeçalho Location devolvido pelo POST).
server.forward-headers-strategy=framework

# Encerramento gracioso: termina as requisições em andamento ao receber SIGTERM (redeploy).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Evita manter a sessão do JPA aberta durante a renderização da resposta.
spring.jpa.open-in-view=false

# CORS: origens do frontend autorizadas a chamar a API (separadas por vírgula).
# Aceita padrões, por exemplo https://*.vercel.app. Em produção, defina CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
