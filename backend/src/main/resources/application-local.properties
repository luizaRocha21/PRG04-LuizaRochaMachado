# =============================================================================
# Perfil "local": desenvolvimento na própria máquina com H2 em memória.
# Não precisa de banco instalado nem de variáveis de ambiente.
#   ./mvnw spring-boot:run
# =============================================================================
spring.datasource.url=jdbc:h2:mem:unibus
spring.datasource.username=sa
spring.datasource.password=

# Cria as tabelas ao subir e apaga ao encerrar (os dados não persistem).
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Console web do H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:unibus)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
