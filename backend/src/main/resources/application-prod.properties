# =============================================================================
# Perfil "prod": execução no Render com PostgreSQL do Supabase.
# Nenhum segredo fica no repositório: tudo vem de variáveis de ambiente.
#
#   DB_URL       jdbc:postgresql://<host-do-pooler>:5432/postgres?sslmode=require
#   DB_USERNAME  postgres.<project-ref>
#   DB_PASSWORD  senha do banco definida no Supabase
# =============================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool pequeno: o pooler do Supabase (modo session) limita conexões simultâneas, e durante um
# redeploy a instância antiga e a nova ficam no ar ao mesmo tempo.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1

# "update" cria/ajusta a tabela automaticamente. Para só validar um esquema criado manualmente,
# defina DDL_AUTO=validate no Render.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

# Console do H2 nunca deve ficar exposto em produção.
spring.h2.console.enabled=false
